<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Chief of Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/landing.css">
</head>
<body class="gate-page">

<div class="gate">
  <a class="gate-mark" href="/">Chief of Staff</a>
  <h1>Sign in</h1>

  {% if problem %}<p class="notice is-problem">{{ problem }}</p>{% endif %}

  <form method="post" action="/signin" class="gate-form">
    <label>
      <span class="mono">Username</span>
      <input name="username" value="{{ username or '' }}" autocomplete="username"
             autofocus required>
    </label>
    <label>
      <span class="mono">Password</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>

  <p class="gate-alt">
    No account yet? <a href="/signup">Create one</a>.
  </p>
</div>

</body>
</html>
